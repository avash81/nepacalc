name: Daily Auto-Deploy to cPanel

on:
  repository_dispatch:
    types: [rates_updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch live rates & build static site
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_PREFETCH: '1'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "calcpro-e1dd9"
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: "ai-studio-d5cad48c-3132-4615-96f7-ef198596220d"
          NEXT_PUBLIC_SITE_URL: "https://nepacalc.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAUAbGWU1eMw7eePLTG0D1gbQRssGqw6V8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "calcpro-e1dd9.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:369907965034:web:71504a7c24a9b3690dfe13"
          NEXT_PUBLIC_GA_ID: "G-G78ED8CZ3D"

      - name: Show fetched rates
        run: |
          echo "=== market-rates.json ==="
          cat public/data/market-rates.json

      - name: Commit built output to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git add -f out/
          git add .cpanel.yml public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/historical-rates.json
          git diff --staged --quiet || git commit -m "ci: daily auto-deploy with fresh FENEGOSIDA rates [skip ci]"
          git push --force-with-lease origin main

      # ── cPanel Deploy: Primary via VersionControlDeployment (skip broken update step) ──
      - name: Trigger cPanel deploy (VersionControlDeployment)
        id: cpanel_deploy
        continue-on-error: true
        run: |
          echo "Triggering cPanel VersionControlDeployment/create..."
          HTTP_CODE=$(curl -k -s -o /tmp/cpanel_deploy.json -w "%{http_code}" \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/cpanel_deploy.json
          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(python3 -c "import json,sys; d=json.load(open('/tmp/cpanel_deploy.json')); print(d.get('status',0))")
            if [ "$STATUS" = "1" ]; then
              echo "✅ cPanel VersionControlDeployment triggered successfully."
              echo "deploy_ok=true" >> $GITHUB_OUTPUT
            else
              ERRORS=$(python3 -c "import json,sys; d=json.load(open('/tmp/cpanel_deploy.json')); print(d.get('errors','unknown'))")
              echo "❌ cPanel returned status=0. Errors: $ERRORS"
              echo "deploy_ok=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ cPanel returned HTTP $HTTP_CODE — EPERM or server error."
            echo "deploy_ok=false" >> $GITHUB_OUTPUT
          fi

      # ── cPanel Deploy: Fallback via VersionControl/update then deploy ──
      - name: Fallback — cPanel pull then deploy
        if: steps.cpanel_deploy.outputs.deploy_ok != 'true'
        continue-on-error: true
        run: |
          echo "⚠️  Primary deploy failed. Trying VersionControl/update first..."
          HTTP_PULL=$(curl -k -s -o /tmp/cpanel_pull.json -w "%{http_code}" \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControl/update?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc")
          echo "Pull HTTP: $HTTP_PULL"
          cat /tmp/cpanel_pull.json || true
          sleep 5
          echo "Retrying VersionControlDeployment/create after pull..."
          HTTP_DEPLOY=$(curl -k -s -o /tmp/cpanel_deploy2.json -w "%{http_code}" \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc")
          echo "Deploy HTTP: $HTTP_DEPLOY"
          cat /tmp/cpanel_deploy2.json || true

      # ── FTP Fallback: Upload key data files directly to public_html ──
      - name: FTP Fallback — upload data files directly
        if: steps.cpanel_deploy.outputs.deploy_ok != 'true'
        continue-on-error: true
        run: |
          echo "⚠️  cPanel API failed. Attempting FTP upload of data files..."
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "⏭️  FTP_PASSWORD secret not set — skipping FTP fallback."
            exit 0
          fi
          # Install lftp
          sudo apt-get install -y lftp 2>/dev/null || true
          # Upload market-rates and live-rates to public_html/data/
          lftp -c "
            set ftp:ssl-allow no;
            open -u nepacalc,${{ secrets.FTP_PASSWORD }} ftp://nepacalc.com;
            put out/data/market-rates.json -o public_html/data/market-rates.json;
            put out/data/live-rates.json   -o public_html/data/live-rates.json;
            put out/data/forex-rates.json  -o public_html/data/forex-rates.json;
            quit
          " && echo "✅ FTP upload succeeded." || echo "❌ FTP upload failed."

      # ── Final status check ──
      - name: Verify live site rates
        if: always()
        run: |
          sleep 10
          echo "Checking live site market-rates.json..."
          HTTP=$(curl -s -o /tmp/live_rates.json -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (NepaCalc-CI-Check)" \
            "https://nepacalc.com/data/market-rates.json")
          echo "HTTP status: $HTTP"
          if [ -f /tmp/live_rates.json ]; then
            LIVE_DATE=$(python3 -c "import json; d=json.load(open('/tmp/live_rates.json')); print(d.get('rate_date','unknown'))" 2>/dev/null || echo "parse error")
            LIVE_GOLD=$(python3 -c "import json; d=json.load(open('/tmp/live_rates.json')); print(d.get('gold',{}).get('tolaNPR',{}).get('current','?'))" 2>/dev/null || echo "parse error")
            echo "Live site rate_date: $LIVE_DATE  |  Gold: Rs.$LIVE_GOLD"
            TODAY=$(date +%Y-%m-%d)
            if [ "$LIVE_DATE" = "$TODAY" ]; then
              echo "✅ Live site is showing TODAY's rates ($TODAY)."
            else
              echo "⚠️  Live site still shows $LIVE_DATE — cPanel deploy likely pending. Manual action needed."
              echo ""
              echo "  ➜ Login to cPanel: https://194.233.72.227:2083"
              echo "  ➜ Go to: Git™ Version Control > nepacalc > Pull or Deploy"
              echo "  ➜ Click: Update from Remote, then Deploy HEAD Commit"
            fi
          fi
