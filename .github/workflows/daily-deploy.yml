name: Daily Auto-Deploy to cPanel

on:
  # ── Runs every day at 6:00 AM UTC = 11:45 AM NPT ──────────────────────────
  # FENEGOSIDA publishes the official rate at ~11:00 AM NPT daily (Sun–Fri)
  schedule:
    - cron: '0 6 * * 1-5'   # Mon–Fri (FENEGOSIDA working days)

  # ── Also allow manual trigger from GitHub Actions tab ────────────────────────
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          fetch-depth: 0

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build (prebuild script fetches FENEGOSIDA rates first)
      - name: Fetch live rates & build static site
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "calcpro-e1dd9"
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: "ai-studio-d5cad48c-3132-4615-96f7-ef198596220d"
          NEXT_PUBLIC_SITE_URL: "https://nepacalc.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAUAbGWU1eMw7eePLTG0D1gbQRssGqw6V8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "calcpro-e1dd9.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:369907965034:web:71504a7c24a9b3690dfe13"
          NEXT_PUBLIC_GA_ID: "G-G78ED8CZ3D"

      # 5. Show what rates were fetched (for build log visibility)
      - name: Show fetched rates
        run: |
          echo "=== market-rates.json ==="
          cat public/data/market-rates.json

      # 6. Commit built output to repo (cPanel pulls via Git — same method as deploy.yml)
      - name: Commit built output & trigger cPanel deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://avash81:${{ secrets.DEPLOY_TOKEN }}@github.com/avash81/nepacalc.git
          git add -f out/
          git add .cpanel.yml public/data/market-rates.json
          git diff --staged --quiet || git commit -m "ci: daily auto-deploy with fresh FENEGOSIDA rates [skip ci]"
          git push --force-with-lease origin main
