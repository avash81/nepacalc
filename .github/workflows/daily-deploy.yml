name: Daily Auto-Deploy to cPanel

on:
  repository_dispatch:
    types: [rates_updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch live rates & build static site
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_PREFETCH: '1'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "calcpro-e1dd9"
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: "ai-studio-d5cad48c-3132-4615-96f7-ef198596220d"
          NEXT_PUBLIC_SITE_URL: "https://nepacalc.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAUAbGWU1eMw7eePLTG0D1gbQRssGqw6V8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "calcpro-e1dd9.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:369907965034:web:71504a7c24a9b3690dfe13"
          NEXT_PUBLIC_GA_ID: "G-G78ED8CZ3D"

      - name: Show fetched rates
        run: |
          echo "=== market-rates.json ==="
          cat public/data/market-rates.json

      - name: Commit built output to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git add -f out/
          git add .cpanel.yml public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/historical-rates.json
          git diff --staged --quiet || git commit -m "ci: daily auto-deploy with fresh FENEGOSIDA rates [skip ci]"
          git push --force-with-lease origin main

      # ── PRIMARY: Upload key JSON files directly via cPanel FileManager API ──
      # This bypasses git entirely and guarantees the JSON files are live immediately.
      - name: Upload rate JSON files via cPanel FileManager API
        id: fileman_upload
        continue-on-error: true
        run: |
          echo "📤 Uploading rate files directly to public_html via cPanel FileManager API..."
          UPLOAD_OK=true

          for FILE in market-rates.json live-rates.json forex-rates.json daily-history.json; do
            SRC="out/data/${FILE}"
            if [ ! -f "$SRC" ]; then
              echo "⚠️  $SRC not found, skipping."
              continue
            fi
            echo "  ↑ Uploading $FILE..."
            HTTP_CODE=$(curl -k -s -o /tmp/upload_${FILE}.json -w "%{http_code}" \
              -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
              -F "dir=/public_html/data" \
              -F "file-1=@${SRC};type=application/json" \
              "https://194.233.72.227:2083/execute/Fileman/upload_files?dir=%2Fpublic_html%2Fdata&overwrite=1")
            echo "    HTTP: $HTTP_CODE"
            cat /tmp/upload_${FILE}.json 2>/dev/null || true
            RESPONSE_STATUS=$(python3 -c "import json; d=json.load(open('/tmp/upload_${FILE}.json')); print(d.get('status',0))" 2>/dev/null || echo "0")
            if [ "$HTTP_CODE" = "200" ] && [ "$RESPONSE_STATUS" = "1" ]; then
              echo "    ✅ $FILE uploaded successfully."
            else
              echo "    ❌ $FILE upload failed (HTTP $HTTP_CODE, status $RESPONSE_STATUS)."
              UPLOAD_OK=false
            fi
          done

          if [ "$UPLOAD_OK" = "true" ]; then
            echo "fileman_ok=true" >> $GITHUB_OUTPUT
            echo "✅ All rate files uploaded to public_html/data/"
          else
            echo "fileman_ok=false" >> $GITHUB_OUTPUT
            echo "⚠️  Some files failed to upload via FileManager."
          fi

      # ── SECONDARY: Trigger cPanel git deploy (pulls full site update) ──
      - name: Trigger cPanel VersionControlDeployment
        id: cpanel_deploy
        continue-on-error: true
        run: |
          echo "🔄 Triggering cPanel VersionControlDeployment/create (full site git deploy)..."
          HTTP_CODE=$(curl -k -s -o /tmp/cpanel_deploy.json -w "%{http_code}" \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/cpanel_deploy.json
          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(python3 -c "import json; d=json.load(open('/tmp/cpanel_deploy.json')); print(d.get('status',0))" 2>/dev/null || echo "0")
            if [ "$STATUS" = "1" ]; then
              echo "deploy_ok=true" >> $GITHUB_OUTPUT
              echo "✅ cPanel git deployment queued (deploy_id: $(python3 -c \"import json; d=json.load(open('/tmp/cpanel_deploy.json')); print(d.get('data',{}).get('deploy_id','?'))\" 2>/dev/null))."
            else
              ERRORS=$(python3 -c "import json; d=json.load(open('/tmp/cpanel_deploy.json')); print(d.get('errors','unknown'))" 2>/dev/null || echo "unknown")
              echo "deploy_ok=false" >> $GITHUB_OUTPUT
              echo "❌ cPanel git deploy returned status=0. Errors: $ERRORS"
            fi
          else
            echo "deploy_ok=false" >> $GITHUB_OUTPUT
            echo "❌ cPanel returned HTTP $HTTP_CODE"
          fi

      # ── FTP Fallback: Upload all built files if FileManager fails ──
      - name: FTP Fallback — upload full site
        if: steps.fileman_upload.outputs.fileman_ok != 'true' && steps.cpanel_deploy.outputs.deploy_ok != 'true'
        continue-on-error: true
        run: |
          echo "⚠️  Both primary methods failed. Trying FTP fallback..."
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "⏭️  FTP_PASSWORD secret not set — skipping FTP fallback."
            exit 0
          fi
          sudo apt-get install -y lftp 2>/dev/null || true
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            open -u nepacalc,${{ secrets.FTP_PASSWORD }} ftp://nepacalc.com;
            put out/data/market-rates.json -o public_html/data/market-rates.json;
            put out/data/live-rates.json   -o public_html/data/live-rates.json;
            put out/data/forex-rates.json  -o public_html/data/forex-rates.json;
            quit
          " && echo "✅ FTP upload succeeded." || echo "❌ FTP upload failed."

      # ── Final verification ──
      - name: Verify live site rates
        if: always()
        run: |
          sleep 15
          EXPECTED_DATE=$(python3 -c "from datetime import datetime; print(datetime.utcnow().strftime('%Y-%m-%d'))")
          echo "Expected date: $EXPECTED_DATE"
          echo "Checking live site market-rates.json..."
          HTTP=$(curl -s -o /tmp/live_rates.json -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (NepaCalc-CI-Check)" \
            "https://nepacalc.com/data/market-rates.json")
          echo "HTTP status: $HTTP"
          if [ -f /tmp/live_rates.json ]; then
            LIVE_DATE=$(python3 -c "import json; d=json.load(open('/tmp/live_rates.json')); print(d.get('rate_date','unknown'))" 2>/dev/null || echo "parse error")
            LIVE_GOLD=$(python3 -c "import json; d=json.load(open('/tmp/live_rates.json')); print(d.get('gold',{}).get('tolaNPR',{}).get('current','?'))" 2>/dev/null || echo "parse error")
            LIVE_SILVER=$(python3 -c "import json; d=json.load(open('/tmp/live_rates.json')); print(d.get('silver',{}).get('tolaNPR',{}).get('current','?'))" 2>/dev/null || echo "parse error")
            echo "Live site: date=$LIVE_DATE | Gold=Rs.$LIVE_GOLD | Silver=Rs.$LIVE_SILVER"
            if [ "$LIVE_DATE" = "$EXPECTED_DATE" ]; then
              echo "✅ Live site is showing TODAY's rates ($EXPECTED_DATE). Deploy successful!"
            else
              echo "⚠️  Live site still shows $LIVE_DATE (expected $EXPECTED_DATE)."
              echo "   The git deploy may still be running on cPanel (takes 1-3 min after queuing)."
              echo ""
              echo "   If still stale after 5 mins, manual fix needed:"
              echo "   ➜ Login: https://194.233.72.227:2083"
              echo "   ➜ Git™ Version Control > nepacalc > Pull or Deploy"
              echo "   ➜ Click: Update from Remote, then Deploy HEAD Commit"
              echo ""
              echo "   OR: Check cPanel Manage API Tokens and regenerate CPANEL_API_TOKEN"
              echo "   then update it in GitHub Secrets > Settings > Secrets > Actions"
            fi
          fi
