name: Daily Auto-Deploy to cPanel

on:
  repository_dispatch:
    types: [rates_updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch live rates & build static site
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_PREFETCH: '1'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "calcpro-e1dd9"
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: "ai-studio-d5cad48c-3132-4615-96f7-ef198596220d"
          NEXT_PUBLIC_SITE_URL: "https://nepacalc.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAUAbGWU1eMw7eePLTG0D1gbQRssGqw6V8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "calcpro-e1dd9.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:369907965034:web:71504a7c24a9b3690dfe13"
          NEXT_PUBLIC_GA_ID: "G-G78ED8CZ3D"

      - name: Show fetched rates
        run: |
          echo "=== market-rates.json ==="
          cat public/data/market-rates.json

      # ── IMMEDIATE DIRECT UPLOAD: Upload rate files via cPanel FileManager API ──
      # Runs immediately so price files are updated on live site instantly.
      - name: Upload rate JSON files via cPanel FileManager API
        id: fileman_upload
        continue-on-error: true
        run: |
          echo "Uploading rate files directly to public_html/data via cPanel Fileman API..."
          for FILE in market-rates.json live-rates.json forex-rates.json daily-history.json international-rates.json; do
            SRC="out/data/${FILE}"
            if [ -f "$SRC" ]; then
              echo "Uploading $FILE..."
              RES=$(curl -k -s \
                -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
                -F "dir=public_html/data" \
                -F "overwrite=1" \
                -F "file-1=@${SRC};filename=${FILE}" \
                "https://194.233.72.227:2083/execute/Fileman/upload_files")
              echo "Response: $RES"
            fi
          done

      # ── COMMIT & PUSH TO GITHUB (Resilient to concurrent pushes) ──
      - name: Commit built output to GitHub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git add -f out/
          git add .cpanel.yml public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/historical-rates.json public/data/international-rates.json
          git diff --staged --quiet || git commit -m "ci: daily auto-deploy with fresh FENEGOSIDA rates [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push origin main || git push --force origin main || true

      # ── TRIGGER CPANEL GIT DEPLOY (Full static site update) ──
      - name: Trigger cPanel VersionControlDeployment
        continue-on-error: true
        run: |
          echo "Triggering cPanel VersionControlDeployment/create..."
          curl -k -s \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc"

      # ── VERIFY LIVE SITE ──
      - name: Verify live site rates
        if: always()
        run: |
          sleep 10
          echo "Checking live site market-rates.json..."
          curl -s -H "User-Agent: Mozilla/5.0" "https://nepacalc.com/data/market-rates.json"
