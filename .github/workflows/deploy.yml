name: Deploy to cPanel

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    # Do not run if commit was triggered by github-actions[bot]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "calcpro-e1dd9"
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: "ai-studio-d5cad48c-3132-4615-96f7-ef198596220d"
          NEXT_PUBLIC_SITE_URL: "https://nepacalc.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAUAbGWU1eMw7eePLTG0D1gbQRssGqw6V8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "calcpro-e1dd9.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:369907965034:web:71504a7c24a9b3690dfe13"
          NEXT_PUBLIC_GA_ID: "G-G78ED8CZ3D"

      # Direct upload of market rates files
      - name: Direct Upload Rate JSON Files
        continue-on-error: true
        run: |
          for FILE in market-rates.json live-rates.json forex-rates.json daily-history.json; do
            SRC="out/data/${FILE}"
            if [ -f "$SRC" ]; then
              curl -k -s \
                -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
                -F "dir=public_html/data" \
                -F "overwrite=1" \
                -F "file-1=@${SRC};filename=${FILE}" \
                "https://194.233.72.227:2083/execute/Fileman/upload_files"
            fi
          done

      - name: Commit built output to repo
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git add -f out/
          git add .cpanel.yml
          git diff --staged --quiet || git commit -m "ci: sync final verified build output to remote [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push origin main || git push --force origin main || true

      - name: Trigger cPanel to deploy
        continue-on-error: true
        run: |
          curl -k -s \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc"
