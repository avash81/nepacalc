name: Smart Window Rate Watcher

# FENEGOSIDA publishes daily between 04:52 - 05:02 UTC (10:37-10:47 AM NPT).
# This watcher starts early at 00:04 UTC (05:49 AM NPT) and checks every 15 mins to avoid GitHub queue delays.
# every 20 minutes until 06:55 UTC (12:40 PM NPT) to catch early updates.
# If rates changed → commits data → dispatches rates_updated → triggers full build + cPanel deploy.
# The full site rebuild injects the new prices into all meta descriptions automatically.

on:
  schedule:
    # Highly optimized for GitHub Free Tier
    # Checks randomly at 9:49, 10:02, 10:18, 10:33, 10:49... up to 12:33 PM NPT (Sunday - Friday only)
    - cron: '4,17,33,48 0,1,4,5,6 * * 0-5'
    # Safety net: every ~30 mins from 12:58 PM to 3:58 PM NPT (07:13-10:43 UTC)
    - cron: '13,43 7,8,9,10 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main       # Ensure we check out the actual branch, not a detached HEAD
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Official Rates (FENEGOSIDA + Forex)
        run: |
          node scripts/fetch-rates.js
          node scripts/fetch-forex.js

      - name: Check if rates have changed
        id: git-check
        run: |
          if git diff --quiet public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json src/hooks/useLiveRates.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  No rate changes — skipping deploy."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Rate changes detected — triggering build and deploy."
          fi

      - name: Commit and push updated rate data
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Setup git config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          
          # 2. Stage and commit FIRST (solves the unstaged changes crash)
          git add public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json src/hooks/useLiveRates.ts
          git commit -m "data: auto-update official rates [skip ci]"
          
          # 3. Pull latest with rebase and auto-resolve any data conflicts in our favor
          git pull --rebase -X theirs origin main
          
          # 4. Push safely
          git push origin main

      - name: Trigger full build and cPanel deploy
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Dispatching rates_updated event to trigger daily-deploy..."
          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "rates_updated"}')
          echo "Dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "204" ]; then
            echo "✅ Deploy triggered successfully."
          else
            echo "⚠️  Unexpected dispatch status: $HTTP_STATUS"
          fi
