name: Smart Window Rate Watcher

# Runs Mon–Fri from 10:00 AM to 12:30 PM NPT (04:15–07:00 UTC)
# Every 15 minutes inside the window — catches FENEGOSIDA publishing at any time

on:
  schedule:
    # 10:00 AM NPT = 04:15 UTC
    - cron: '15 4 * * 1-5'
    # 10:15 AM NPT = 04:30 UTC
    - cron: '30 4 * * 1-5'
    # 10:30 AM NPT = 04:45 UTC
    - cron: '45 4 * * 1-5'
    # 10:45 AM NPT = 05:00 UTC
    - cron: '0 5 * * 1-5'
    # 11:00 AM NPT = 05:15 UTC
    - cron: '15 5 * * 1-5'
    # 11:15 AM NPT = 05:30 UTC
    - cron: '30 5 * * 1-5'
    # 11:30 AM NPT = 05:45 UTC
    - cron: '45 5 * * 1-5'
    # 11:45 AM NPT = 06:00 UTC
    - cron: '0 6 * * 1-5'
    # 12:00 PM NPT = 06:15 UTC
    - cron: '15 6 * * 1-5'
    # 12:15 PM NPT = 06:30 UTC
    - cron: '30 6 * * 1-5'
    # 12:30 PM NPT = 06:45 UTC
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fetch Official Rates (FENEGOSIDA + Forex)
        run: |
          node scripts/fetch-rates.js
          node scripts/fetch-forex.js

      - name: Check if rates have changed
        id: git-check
        run: |
          if git diff --quiet public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json src/hooks/useLiveRates.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  No rate changes detected. Skipping build."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Rate changes detected. Proceeding with build and deploy."
          fi

      - name: Commit updated rate data
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git pull --rebase origin main
          git add public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json src/hooks/useLiveRates.ts
          git commit -m "data: auto-update official rates [skip ci]"
          git push origin HEAD

      - name: Install dependencies
        if: steps.git-check.outputs.changed == 'true'
        run: npm ci

      - name: Build static site with fresh rates
        if: steps.git-check.outputs.changed == 'true'
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: "https://nepacalc.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "calcpro-e1dd9"
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: "ai-studio-d5cad48c-3132-4615-96f7-ef198596220d"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAUAbGWU1eMw7eePLTG0D1gbQRssGqw6V8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "calcpro-e1dd9.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:369907965034:web:71504a7c24a9b3690dfe13"
          NEXT_PUBLIC_GA_ID: "G-G78ED8CZ3D"

      - name: Commit built output to main
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git pull --rebase origin main
          git add -f out/
          git add public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json
          git diff --staged --quiet || git commit -m "ci: auto-deploy fresh rates build [skip ci]"
          git push --force-with-lease origin main

      - name: Deploy to cPanel — pull from GitHub
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "🚀 Triggering cPanel git pull..."
          PULL_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControl/update?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc-live")
          echo "cPanel pull HTTP status: $PULL_STATUS"

      - name: Deploy to cPanel — deploy to public_html
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "🚀 Triggering cPanel deploy to public_html..."
          DEPLOY_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: cpanel nepacalc:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://194.233.72.227:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnepacalc%2Frepositories%2Fnepacalc-live")
          echo "cPanel deploy HTTP status: $DEPLOY_STATUS"

      - name: Log final status
        run: |
          echo "=== Rate Watcher Complete ==="
          echo "Changed: ${{ steps.git-check.outputs.changed }}"
          cat public/data/market-rates.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'Gold (1 Tola):   NPR {d[\"gold\"][\"tolaNPR\"][\"current\"]:,}')
          print(f'Silver (1 Tola): NPR {d[\"silver\"][\"tolaNPR\"][\"current\"]:,}')
          print(f'Status:          {d[\"status\"]}')
          print(f'Rate Date:       {d[\"rate_date\"]}')
          " 2>/dev/null || cat public/data/market-rates.json
