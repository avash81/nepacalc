name: Smart Window Rate Watcher

# Runs Mon–Fri from 10:00 AM to 12:30 PM NPT (04:15–07:00 UTC)
# Every 15 minutes inside the window — catches FENEGOSIDA publishing at any time
# On rate change: commits data → triggers daily-deploy.yml via repository_dispatch

on:
  schedule:
    # 10:00 AM NPT = 04:15 UTC
    - cron: '15 4 * * 1-5'
    # 10:15 AM NPT = 04:30 UTC
    - cron: '30 4 * * 1-5'
    # 10:30 AM NPT = 04:45 UTC
    - cron: '45 4 * * 1-5'
    # 10:45 AM NPT = 05:00 UTC
    - cron: '0 5 * * 1-5'
    # 11:00 AM NPT = 05:15 UTC
    - cron: '15 5 * * 1-5'
    # 11:15 AM NPT = 05:30 UTC
    - cron: '30 5 * * 1-5'
    # 11:30 AM NPT = 05:45 UTC
    - cron: '45 5 * * 1-5'
    # 11:45 AM NPT = 06:00 UTC
    - cron: '0 6 * * 1-5'
    # 12:00 PM NPT = 06:15 UTC
    - cron: '15 6 * * 1-5'
    # 12:15 PM NPT = 06:30 UTC
    - cron: '30 6 * * 1-5'
    # 12:30 PM NPT = 06:45 UTC
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Official Rates (FENEGOSIDA + Forex)
        run: |
          node scripts/fetch-rates.js
          node scripts/fetch-forex.js

      - name: Check if rates have changed
        id: git-check
        run: |
          if git diff --quiet public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json src/hooks/useLiveRates.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  No rate changes — skipping deploy."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Rate changes detected — triggering build and deploy."
          fi

      - name: Commit updated rate data
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/avash81/nepacalc.git
          git pull --rebase origin main
          git add public/data/live-rates.json public/data/market-rates.json public/data/forex-rates.json public/data/daily-history.json src/hooks/useLiveRates.ts
          git commit -m "data: auto-update official rates [skip ci]"
          git push origin HEAD

      - name: Trigger full build and cPanel deploy
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Dispatching rates_updated event to trigger daily-deploy..."
          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "rates_updated"}')
          echo "Dispatch HTTP status: $HTTP_STATUS"
          cat /tmp/dispatch_response.json || true
          if [ "$HTTP_STATUS" = "204" ]; then
            echo "✅ Deploy triggered successfully."
          else
            echo "⚠️  Unexpected dispatch status: $HTTP_STATUS"
          fi

      - name: Show current rates
        run: |
          echo "=== Current market-rates.json ==="
          cat public/data/market-rates.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'  Gold (1 Tola):   NPR {d[\"gold\"][\"tolaNPR\"][\"current\"]:,}')
          print(f'  Silver (1 Tola): NPR {d[\"silver\"][\"tolaNPR\"][\"current\"]:,}')
          print(f'  Status:          {d[\"status\"]}')
          print(f'  Rate Date:       {d[\"rate_date\"]}')
          " 2>/dev/null || cat public/data/market-rates.json
          echo ""
          echo "=== Current forex-rates.json ==="
          cat public/data/forex-rates.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          r = d.get('rates', {})
          print(f'  1 USD = NPR {r.get(\"NPR\", \"N/A\")}')
          print(f'  1 USD = INR {r.get(\"INR\", \"N/A\")}')
          print(f'  Source: {d.get(\"source\", \"N/A\")}')
          print(f'  Date:   {d.get(\"date\", \"N/A\")}')
          " 2>/dev/null || cat public/data/forex-rates.json
